[project]
name = "fire-stick-remote"
version = "0.1.0"
description = "Reverse-engineer the Fire TV Alexa Voice Remote BLE microphone audio stream"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # opuslib is a ctypes binding; it needs libopus on the host.
    # Arch: pacman -S opus ; Alpine: apk add opus
    "opuslib>=3.0.1",
    "pyyaml>=6.0",       # GATT enum catalog (02)
    "dbus-fast>=2.0",    # talk to BlueZ over D-Bus (02)
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
